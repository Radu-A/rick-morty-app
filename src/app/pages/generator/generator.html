<p>generator works!</p>
<div class="generator-layout">
  <section class="form-section">
    <h2>Create New Character</h2>
    <form class="custom-form" [formGroup]="form" (ngSubmit)="this.onSubmit()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" placeholder="Morty Malvado..." formControlName="name" />
      </div>
      <div class="form-group">
        <label>Species</label>
        <input type="text" placeholder="Alien, Robot..." formControlName="species" />
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" placeholder="https://..." formControlName="image" />
      </div>
      <button type="submit" class="btn-create">Generate Character</button>
    </form>
  </section>

  <section class="results-section">
    <h2>New Character</h2>
    <div class="mini-grid">
      @if (characters$ | async; as characters) { @for (character of characters; track $index) {
      <div class="mini-card">
        <img [src]="character.image" alt="New" />
        <div class="mini-card-info">
          <h4>{{ character.name }}</h4>
          <p>{{ character.species }}</p>
        </div>
      </div>
      } }
    </div>
  </section>
</div>
